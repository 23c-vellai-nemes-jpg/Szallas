<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalások - Balaton Resort</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Balaton Resort
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Kezdőlap</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="foglalasok.html">Foglalások</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="foglalas.html">Új foglalás</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-5">

        <div class="text-center mb-5">
            <h1>Foglalások</h1>
            <p class="text-muted">
                A rendszerben található foglalások megtekintése és kezelése
            </p>
        </div>


        <div id="uzenet"></div>


        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <h5 class="card-title mb-3">
                    Keresés és szűrés
                </h5>

                <div class="row g-3">

                    <div class="col-md-5">
                        <label for="kereses" class="form-label">
                            Keresés név alapján
                        </label>

                        <input
                            type="text"
                            id="kereses"
                            class="form-control"
                            placeholder="Írd be a nevet..."
                        >
                    </div>


                    <div class="col-md-4">
                        <label for="szallasSzures" class="form-label">
                            Szállás
                        </label>

                        <select id="szallasSzures" class="form-select">
                            <option value="">
                                Összes szállás
                            </option>
                        </select>
                    </div>


                    <div class="col-md-3">
                        <label class="form-label">
                            Nézet
                        </label>

                        <div class="d-flex gap-2">

                            <button
                                id="tablaGomb"
                                type="button"
                                class="btn btn-primary flex-fill"
                            >
                                Táblázat
                            </button>

                            <button
                                id="kartyaGomb"
                                type="button"
                                class="btn btn-outline-primary flex-fill"
                            >
                                Kártyák
                            </button>

                        </div>
                    </div>

                </div>

            </div>
        </div>


        <div id="foglalasokTartalom"></div>

    </main>


    <button
        id="tetoreGomb"
        type="button"
        class="btn btn-dark"
    >
        ↑
    </button>


    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            © 2026 Balaton Resort
        </p>
    </footer>


    <script src="js/foglalasok.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
<script src="js/foglalasok.js"></script>
</html>
