<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foglalások – Balaton Resort</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Balaton Resort</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-label="Menü megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Kezdőlap</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="foglalasok.html">Foglalások</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="foglalas.html">Új foglalás</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="oldal-fej">
        <div class="container">
            <p class="kis-cim">BALATON RESORT</p>
            <h1>Foglalások kezelése</h1>
            <p class="mb-0">
                Keresd, szűrd, rendezd vagy töröld a foglalásokat.
            </p>
        </div>
    </header>

    <main class="container py-5">
        <div class="panel">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h2 class="h4 mb-1">Foglalásaim</h2>
                    <span id="talalatok" class="small-note">
                        Foglalások betöltése...
                    </span>
                </div>

                <a class="btn btn-primary" href="foglalas.html">
                    + Új foglalás
                </a>
            </div>

            <div id="uzenet" aria-live="polite"></div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="kereses">
                        Keresés név alapján
                    </label>

                    <input class="form-control" id="kereses"
                        placeholder="Írd be a vendég nevét...">
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="szallasSzures">
                        Szűrés szállás szerint
                    </label>

                    <select class="form-select" id="szallasSzures">
                        <option value="">Minden szállás</option>
                    </select>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-outline-secondary" id="tablaGomb" type="button">
                    Táblázatos nézet
                </button>

                <button class="btn btn-outline-secondary" id="kartyaGomb" type="button">
                    Kártyás nézet
                </button>

                <button class="btn btn-outline-secondary" id="rendezesNev" type="button">
                    Rendezés név szerint ↕
                </button>

                <button class="btn btn-outline-secondary" id="rendezesErkezes" type="button">
                    Rendezés érkezés szerint ↕
                </button>

                <button class="btn btn-outline-secondary" id="rendezesAr" type="button">
                    Rendezés ár szerint ↕
                </button>

                <button class="btn btn-outline-danger ms-md-auto" id="toroltMutat" type="button">
                    Töröltek megjelenítése
                </button>
            </div>

            <div id="foglalasokTartalom"></div>

            <p class="small-note mt-3 mb-0">
                Megjegyzés: a foglalások adatai ebben a böngészőben tárolódnak.
            </p>

        </div>
    </main>

    <button id="tetoreGomb" class="btn btn-primary" type="button"
        title="Ugrás az oldal tetejére" aria-label="Ugrás az oldal tetejére">
        ↑
    </button>

    <footer class="footer bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 Balaton Resort</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/foglalasok.js"></script>

</body>
</html>
