<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Új foglalás – Balaton Resort</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Balaton Resort</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-label="Menü megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Kezdőlap</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="foglalasok.html">Foglalások</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="foglalas.html">Új foglalás</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="oldal-fej">
        <div class="container">
            <p class="kis-cim">BALATON RESORT</p>
            <h1>Új foglalás</h1>
            <p class="mb-0">
                Add meg az adatokat, és ellenőrizd a foglalás árát.
            </p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="panel">
                    <div id="uzenet" aria-live="polite"></div>

                    <form id="foglalasForm">

                        <div class="mb-3">
                            <label class="form-label" for="nev">
                                Teljes név
                            </label>

                            <input class="form-control" id="nev"
                                required maxlength="100"
                                placeholder="Pl. Kovács Péter">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="email">
                                    E-mail-cím
                                </label>

                                <input class="form-control" id="email"
                                    type="email" required
                                    placeholder="nev@email.com">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="telefon">
                                    Telefonszám
                                </label>

                                <input class="form-control" id="telefon"
                                    type="tel" required
                                    placeholder="+36301234567">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="szallas">
                                Szállás
                            </label>

                            <select class="form-select" id="szallas" required>
                                <option value="">Szállás betöltése...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="erkezes">
                                    Érkezés
                                </label>

                                <input class="form-control" id="erkezes"
                                    type="date" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="tavozas">
                                    Távozás
                                </label>

                                <input class="form-control" id="tavozas"
                                    type="date" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="szemelyek">
                                Személyek száma
                            </label>

                            <input class="form-control" id="szemelyek"
                                type="number" min="1" value="2" required>
                        </div>

                        <div class="alert alert-light border">
                            <div>
                                Éjszakák száma:
                                <strong id="ejszakak">0</strong>
                            </div>

                            <div>
                                Becsült teljes ár:
                                <strong id="ar">–</strong>
                            </div>

                            <div class="small-note mt-1">
                                A foglalás mentése ebben a böngészőben történik.
                            </div>
                        </div>

                        <button class="btn btn-primary" type="submit">
                            Foglalás mentése
                        </button>

                        <a href="foglalasok.html" class="btn btn-outline-secondary">
                            Foglalások megtekintése
                        </a>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 Balaton Resort</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/foglalas.js"></script>

</body>
</html>
